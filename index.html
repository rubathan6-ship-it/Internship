<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document Viewer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="viewer-shell">
      <object
        class="pdf-viewer"
        data="./NSWKA0126005.pdf#view=FitH&toolbar=1&navpanes=0"
        type="application/pdf"
        aria-label="PDF document"
      >
        <iframe
          class="pdf-viewer"
          src="./NSWKA0126005.pdf#view=FitH&toolbar=1&navpanes=0"
          title="PDF document"
        >
          <p>
            Your browser cannot display the PDF.
            <a href="./NSWKA0126005.pdf" target="_blank" rel="noopener">Open the PDF</a>.
          </p>
        </iframe>
      </object>
    </main>
  </body>
</html>
